<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Checkout PIX - QuantumPay</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        h2 { color: #ff6600; text-align: center; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #aaa; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #ff6600; color: #fff; border: none; padding: 12px; margin-top: 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #e55b00; }
        #qr-container { display: none; text-align: center; margin-top: 20px; }
        #qr-container img { width: 200px; border-radius: 8px; background: #fff; padding: 10px; }
        .copia-cola { font-size: 10px; word-break: break-all; background: #2a2a2a; padding: 8px; border-radius: 4px; margin-top: 10px; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2>Checkout QuantumPay</h2>

    <div id="form-container">
        <label>Nome do Cliente</label>
        <input type="text" id="nome" value="Cliente Exemplo Silva">

        <label>Email</label>
        <input type="email" id="email" value="cliente@exemplo.com">

        <label>CPF (apenas números)</label>
        <input type="text" id="documento" value="11122233344">

        <label>Telemóvel</label>
        <input type="text" id="telefone" value="11912345678">

        <label>Valor (R$)</label>
        <input type="number" id="valor" value="10.00" step="0.01">

        <button onclick="gerarPix()">Gerar PIX</button>
    </div>

    <div id="qr-container">
        <h3>Escaneie o QR Code</h3>
        <img id="qr-img" src="" alt="QR Code PIX">
        <p>Ou copie o código Pix Copia e Cola:</p>
        <div class="copia-cola" id="pix-emv"></div>
        <p id="status-pagamento" style="color: #ffcc00; margin-top: 15px;">A aguardar pagamento...</p>
    </div>
</div>

<script>
async function gerarPix() {
    const nome = document.getElementById('nome').value;
    const email = document.getElementById('email').value;
    const documento = document.getElementById('documento').value;
    const telefone = document.getElementById('telefone').value;
    const valorReais = parseFloat(document.getElementById('valor').value);
    const amountInCents = Math.round(valorReais * 100);

    const dadosPagamento = {
        amountInCents,
        description: "Pagamento de Serviços",
        customer: { name: nome, email, document: documento, phone: telefone }
    };

    try {
        const resposta = await fetch('/api/criar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dadosPagamento)
        });

        const resultado = await resposta.json();

        if (resultado.success) {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('qr-container').style.display = 'block';

            document.getElementById('qr-img').src = resultado.data.pix.qrCode;
            document.getElementById('pix-emv').innerText = resultado.data.pix.emv;

            iniciarPolling(resultado.data.id);
        } else {
            alert('Erro ao gerar PIX: ' + (resultado.message || 'Erro desconhecido'));
        }
    } catch (erro) {
        alert('Erro na requisição ao servidor.');
        console.error(erro);
    }
}

function iniciarPolling(transactionId) {
    const intervalo = setInterval(async () => {
        try {
            const resposta = await fetch(`/api/transacao/${transactionId}`);
            const data = await resposta.json();

            if (data.status === 'paid') {
                clearInterval(intervalo);
                document.getElementById('status-pagamento').style.color = '#00ff00';
                document.getElementById('status-pagamento').innerText = 'Pagamento Aprovado com Sucesso! 🎉';
            }
        } catch (erro) {
            console.error('Erro no polling:', erro);
        }
    }, 3000);
}
</script>

</body>
</html>
