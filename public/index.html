    <script>
        async function gerarPix() {
            const btn = document.getElementById('btn-pagar');
            btn.disabled = true;
            btn.innerText = 'A gerar Pix real...';

            try {
                const response = await fetch('/api/criar-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const jsonResponse = await response.json();

                // Procura o código Pix na resposta padrão da API (seja direto ou dentro de .data)
                const payloadData = jsonResponse.data || jsonResponse;
                const codigoPix = payloadData.qrCode || payloadData.pixCopyPaste || payloadData.emv || JSON.stringify(jsonResponse);

                document.getElementById('pix-copia-cola').value = codigoPix;
                document.getElementById('checkout-view').classList.add('hidden');
                document.getElementById('pix-view').classList.remove('hidden');
                
                if(payloadData.qrCodeImage || payloadData.imagemQrcode) {
                    document.getElementById('qrcode-container').innerHTML = `<img src="${payloadData.qrCodeImage || payloadData.imagemQrcode}" class="w-full h-full object-contain">`;
                }
            } catch (error) {
                alert('Erro ao gerar pagamento: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'Tentar Novamente';
            }
        }

        function copiarPix() {
            const input = document.getElementById('pix-copia-cola');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('Código Pix copiado com sucesso!');
        }
    </script>
