<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pix - Quantum Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-500/20">Ambiente Real - Conta Aprovada</span>
            <h1 class="text-xl font-bold mt-3">Pagamento via Pix</h1>
            <p class="text-sm text-slate-400 mt-1">Geração de cobrança instantânea</p>
        </div>

        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 mb-6 space-y-3">
            <div class="flex justify-between text-sm">
                <span class="text-slate-400">Cliente:</span>
                <span class="font-medium text-slate-200">Marcos Gonçalo Medeiros Ferraz</span>
            </div>
            <div class="flex justify-between text-sm pt-2 border-t border-slate-700/50">
                <span class="text-slate-400">Valor Total:</span>
                <span class="font-bold text-emerald-400 text-lg">R$ 1.000,00</span>
            </div>
        </div>

        <div id="checkout-view">
            <button onclick="gerarPix()" id="btn-pagar" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                Gerar QR Code Pix Real
            </button>
        </div>

        <div id="pix-view" class="hidden space-y-4 text-center">
            <div class="bg-white p-4 rounded-xl inline-block mx-auto shadow-inner">
                <div id="qrcode-container" class="w-48 h-48 bg-slate-200 flex items-center justify-center text-xs text-slate-600 rounded">
                    Carregando QR Code...
                </div>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-slate-400 block">Pix Copia e Cola:</label>
                <input type="text" id="pix-copia-cola" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-300 text-center select-all">
            </div>
            <button onclick="copiarPix()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition-all">
                Copiar Código Pix
            </button>
        </div>
    </div>

    <script>
        async function gerarPix() {
            const btn = document.getElementById('btn-pagar');
            btn.disabled = true;
            btn.innerText = 'A gerar Pix real...';

            try {
                const response = await fetch('/api/criar-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const jsonResponse = await response.json();

                const payloadData = jsonResponse.data || jsonResponse;
                const codigoPix = payloadData.qrCode || payloadData.pixCopyPaste || payloadData.emv || JSON.stringify(jsonResponse);

                document.getElementById('pix-copia-cola').value = codigoPix;
                document.getElementById('checkout-view').classList.add('hidden');
                document.getElementById('pix-view').classList.remove('hidden');
                
                if(payloadData.qrCodeImage || payloadData.imagemQrcode) {
                    document.getElementById('qrcode-container').innerHTML = `<img src="${payloadData.qrCodeImage || payloadData.imagemQrcode}" class="w-full h-full object-contain">`;
                }
            } catch (error) {
                alert('Erro ao gerar pagamento: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'Tentar Novamente';
            }
        }

        function copiarPix() {
            const input = document.getElementById('pix-copia-cola');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('Código Pix copiado com sucesso!');
        }
    </script>
</body>
</html>
